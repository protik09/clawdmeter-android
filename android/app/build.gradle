plugins { id 'com.android.application' }

android {
    namespace 'local.clawdmeter'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'local.clawdmeter'
        minSdk 33
        targetSdk 36
        // release CI passes these from the git tag (see .github/workflows/release.yml); local builds are "dev",
        // which never self-update
        // `=` matters: `versionCode (x).toInteger()` parses as `versionCode(x).toInteger()`
        versionCode = (findProperty('appVersionCode') ?: '1').toInteger()
        versionName = findProperty('appVersion') ?: 'dev'
        // Where the app looks for new releases. A test build can point it elsewhere: -PupdateFeed=http://...
        def feed = findProperty('updateFeed') ?: 'https://api.github.com/repos/protik09/clawdmeter-android/releases/latest'
        buildConfigField 'String', 'UPDATE_FEED', "\"${feed}\""
    }
    // One permanent key for every release. Android installs an update only when it's signed with the installed
    // app's key, and a fresh CI runner would otherwise sign with a new throwaway debug key each time.
    // Release CI sets these from repo secrets. Local builds use the same key from ~/.clawdmeter-signing (so a dev
    // build installs over a release and back); without that folder they fall back to this machine's debug key.
    def keyDir = new File(System.getProperty('user.home'), '.clawdmeter-signing')
    def keystore = System.getenv('CLAWDMETER_KEYSTORE') ?: (new File(keyDir, 'clawdmeter.p12').exists() ? new File(keyDir, 'clawdmeter.p12').path : null)
    def storePass = System.getenv('CLAWDMETER_KEYSTORE_PASSWORD') ?: (new File(keyDir, 'password.txt').exists() ? new File(keyDir, 'password.txt').text.trim() : null)
    if (keystore && storePass) {
        signingConfigs {
            debug {
                storeFile file(keystore)
                storePassword storePass
                keyAlias 'clawdmeter'
                keyPassword storePass
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.lint {
    checkOnly 'NewApi', 'InlinedApi'   // keep the Android 13 floor honest: fail on calls newer than minSdk
    abortOnError true
}
