plugins { id 'com.android.application' }

android {
    namespace 'local.clawdmeter'
    compileSdk 36
    defaultConfig {
        applicationId 'local.clawdmeter'
        minSdk 33
        targetSdk 36
        // release CI passes these from the git tag (see .github/workflows/release.yml); local builds keep 1.0
        versionCode (findProperty('appVersionCode') ?: '1').toInteger()
        versionName findProperty('appVersion') ?: '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.lint {
    checkOnly 'NewApi', 'InlinedApi'   // keep the Android 13 floor honest: fail on calls newer than minSdk
    abortOnError true
}
