plugins { id 'com.android.application' }

android {
    namespace 'local.clawdmeter'
    compileSdk 36
    defaultConfig {
        applicationId 'local.clawdmeter'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.lint {
    checkOnly 'NewApi', 'InlinedApi'   // keep the Android 13 floor honest: fail on calls newer than minSdk
    abortOnError true
}
